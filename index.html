<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>College Office Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ═══════════════════════════════════════════
     MAIN SITE
     ═══════════════════════════════════════════ -->
    <div class="site-shell">
      <!-- Blob background -->
      <div class="background-art">
        <div class="background-pink"></div>
        <div class="background-yellow"></div>
        <div class="background-blue"></div>
      </div>

      <div class="site-content">
        <!-- HERO -->
        <header class="hero">
          <div class="hero-layout">
            <img id="school-logo" alt="" class="school-logo" />
            <div class="hero-heading-group">
              <div class="update-badge">
                <span class="update-indicator"></span>
                <span class="update-text"
                  ><span data-site="updateLabel"></span
                ></span>
              </div>
              <h1 class="hero-title">
                <span data-site="headlineStart"></span><br /><span
                  data-site="headlineMiddle"
                ></span
                ><span class="headline-highlight"
                  ><span class="headline-underline"></span
                  ><span data-site="headlineHighlight"></span
                ></span>
              </h1>
            </div>
            <div class="hero-intro-group">
              <p class="hero-intro"><span data-site="intro"></span></p>
              <div class="search-field search-wrap">
                <span class="search-icon">🔍</span>
                <input
                  id="search"
                  type="text"
                  aria-label="Search resources and people"
                  class="search-input"
                />
              </div>
            </div>
          </div>
        </header>

        <!-- CAROUSEL -->
        <section class="announcement-section">
          <div id="carousel-wrap" class="carousel-frame">
            <div id="slides-container" class="carousel-slides"></div>
            <div id="dots-container" class="carousel-dots"></div>
          </div>
        </section>

        <!-- BENTO -->
        <main id="bento" class="resource-grid"></main>

        <!-- FOOTER -->
        <footer class="site-footer">
          <div class="contact-panel">
            <div class="contact-copy">
              <h3 class="contact-heading">
                <span data-site="contactHeading"></span>
              </h3>
              <p class="contact-details">
                <span data-site="officeDetails"></span><br /><span
                  data-site="walkInHours"
                ></span>
              </p>
            </div>
            <a id="contact-link" class="contact-button btn-dark">
              <span class="contact-icon">✉️</span
              ><span data-site="contactButton"></span>
            </a>
          </div>
        </footer>
      </div>
    </div>

    <!-- Content first, then rendering. Works with a static host or a local preview. -->
    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
